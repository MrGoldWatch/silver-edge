name: Deploy to Railway

on:
  push:
    branches: [ main, 2.0.0 ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci
        
    - name: Build backend
      run: |
        cd backend
        npm run build
        
    - name: Run tests
      run: |
        cd backend
        npm test
        
    - name: Install Railway CLI
      run: npm install -g @railway/cli

    - name: Deploy to Railway (Development)
      if: github.ref == 'refs/heads/2.0.0'
      run: |
        cd backend
        echo "Deploying to Railway development environment..."
        railway up --service backend-dev
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    - name: Deploy to Railway (Production)
      if: github.ref == 'refs/heads/main'
      run: |
        cd backend
        echo "Deploying to Railway production environment..."
        railway up --service backend-prod
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    - name: Run database migrations (Development)
      if: github.ref == 'refs/heads/2.0.0'
      run: |
        cd backend
        npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}

    - name: Run database migrations (Production)
      if: github.ref == 'refs/heads/main'
      run: |
        cd backend
        npx prisma migrate deploy
      env:
        DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
